<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1180" height="760" fill="#ffffff"/>
<text x="30" y="44" font-size="21" fill="#18181b" font-weight="bold" text-anchor="start">Modelo do grafo — Legislação Brasileira</text>
<text x="30" y="68" font-size="13" fill="#6e6e76" text-anchor="start">Label único :Norma + propriedade tipo; relações nomeadas pelo efeito jurídico</text>
<rect x="40" y="95" width="420" height="300" rx="10" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<rect x="40" y="95" width="420" height="34" rx="10" fill="#2563eb"/>
<rect x="40" y="119" width="420" height="10" fill="#2563eb"/>
<text x="52" y="118" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start">:Norma</text>
<text x="54" y="151" font-size="12.5" fill="#18181b" text-anchor="start">id            &quot;federal:BR:L:10406/2002&quot;</text>
<text x="54" y="170" font-size="12.5" fill="#18181b" text-anchor="start">titulo        &quot;Lei nº 10.406 de 10/01/2002&quot;</text>
<text x="54" y="189" font-size="12.5" fill="#18181b" text-anchor="start">tipo          &quot;Lei Ordinária&quot;</text>
<text x="54" y="208" font-size="12.5" fill="#18181b" text-anchor="start">numero        &quot;10406&quot;      ano  2002 (int)</text>
<text x="54" y="227" font-size="12.5" fill="#18181b" text-anchor="start">esfera        &quot;federal&quot;</text>
<text x="54" y="246" font-size="12.5" fill="#18181b" text-anchor="start">uf            null  (só estadual/municipal)</text>
<text x="54" y="265" font-size="12.5" fill="#18181b" text-anchor="start">ementa        &quot;Institui o Código Civil.&quot;</text>
<text x="54" y="284" font-size="12.5" fill="#18181b" text-anchor="start">situacao      situação declarada no acervo</text>
<text x="54" y="303" font-size="12.5" fill="#18181b" text-anchor="start">vigente       true</text>
<text x="54" y="322" font-size="12.5" fill="#18181b" text-anchor="start">vigencia_origem  como se chegou à conclusão</text>
<text x="54" y="341" font-size="12.5" fill="#18181b" text-anchor="start">versao_texto  &quot;compilada (vigente)&quot;</text>
<text x="54" y="360" font-size="12.5" fill="#18181b" text-anchor="start">urn / fonte / arquivo</text>
<rect x="760" y="95" width="370" height="215" rx="10" fill="#fff" stroke="#6e6e76" stroke-width="3"/>
<rect x="760" y="95" width="370" height="34" rx="10" fill="#6e6e76"/>
<rect x="760" y="119" width="370" height="10" fill="#6e6e76"/>
<text x="772" y="118" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start">Constraint e índices</text>
<text x="774" y="151" font-size="12.5" fill="#18181b" text-anchor="start">UNIQUE  (:Norma).id</text>
<text x="774" y="170" font-size="12.5" fill="#18181b" text-anchor="start">INDEX   :Norma(tipo)</text>
<text x="774" y="189" font-size="12.5" fill="#18181b" text-anchor="start">INDEX   :Norma(ano)</text>
<text x="774" y="208" font-size="12.5" fill="#18181b" text-anchor="start">INDEX   :Norma(esfera)</text>
<text x="774" y="227" font-size="12.5" fill="#18181b" text-anchor="start">INDEX   :Norma(numero)</text>
<text x="774" y="246" font-size="12.5" fill="#18181b" text-anchor="start"></text>
<text x="774" y="265" font-size="12.5" fill="#18181b" text-anchor="start">Carga idempotente: MERGE por id</text>
<rect x="760" y="330" width="370" height="175" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="3"/>
<rect x="760" y="330" width="370" height="34" rx="10" fill="#b91c1c"/>
<rect x="760" y="354" width="370" height="10" fill="#b91c1c"/>
<text x="772" y="353" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start">Direção das arestas</text>
<text x="774" y="386" font-size="12.5" fill="#18181b" text-anchor="start">REVOGA/ALTERA/INCLUI:</text>
<text x="774" y="405" font-size="12.5" fill="#18181b" text-anchor="start">   citada → contém a anotação</text>
<text x="774" y="424" font-size="12.5" fill="#18181b" text-anchor="start">REFERENCIA:</text>
<text x="774" y="443" font-size="12.5" fill="#18181b" text-anchor="start">   contém o &quot;Vide&quot; → citada</text>
<text x="774" y="462" font-size="12.5" fill="#18181b" text-anchor="start"></text>
<text x="774" y="481" font-size="12.5" fill="#18181b" text-anchor="start">Revertido em 2026-11-15 (v2).</text>
<rect x="60" y="426" width="150" height="30" rx="6" fill="#b91c1c"/>
<text x="72" y="446" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="start">REVOGA</text>
<text x="224" y="446" font-size="12" fill="#18181b" text-anchor="start">(:Norma)-[:REVOGA]-&gt;(:Norma)</text>
<text x="520" y="446" font-size="12" fill="#6e6e76" text-anchor="start">a origem revogou a destino</text>
<text x="1090" y="446" font-size="12" fill="#18181b" font-weight="bold" text-anchor="end">1.028</text>
<rect x="60" y="464" width="150" height="30" rx="6" fill="#6d28d9"/>
<text x="72" y="484" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="start">ALTERA</text>
<text x="224" y="484" font-size="12" fill="#18181b" text-anchor="start">(:Norma)-[:ALTERA]-&gt;(:Norma)</text>
<text x="520" y="484" font-size="12" fill="#6e6e76" text-anchor="start">deu nova redação ao dispositivo</text>
<text x="1090" y="484" font-size="12" fill="#18181b" font-weight="bold" text-anchor="end">2.699</text>
<rect x="60" y="502" width="150" height="30" rx="6" fill="#107a57"/>
<text x="72" y="522" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="start">INCLUI</text>
<text x="224" y="522" font-size="12" fill="#18181b" text-anchor="start">(:Norma)-[:INCLUI]-&gt;(:Norma)</text>
<text x="520" y="522" font-size="12" fill="#6e6e76" text-anchor="start">incluiu dispositivo</text>
<text x="1090" y="522" font-size="12" fill="#18181b" font-weight="bold" text-anchor="end">5</text>
<rect x="60" y="540" width="150" height="30" rx="6" fill="#2563eb"/>
<text x="72" y="560" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="start">REFERENCIA</text>
<text x="224" y="560" font-size="12" fill="#18181b" text-anchor="start">(:Norma)-[:REFERENCIA]-&gt;(:Norma)</text>
<text x="520" y="560" font-size="12" fill="#6e6e76" text-anchor="start">remissão sem efeito (&quot;Vide&quot;)</text>
<text x="1090" y="560" font-size="12" fill="#18181b" font-weight="bold" text-anchor="end">242</text>
<text x="60" y="610" font-size="12.5" fill="#2563eb" text-anchor="start">Toda aresta carrega a propriedade trecho — o texto original que a originou, para auditoria contra a fonte.</text>
<text x="60" y="636" font-size="13" fill="#18181b" font-weight="bold" text-anchor="start">16.321 nós :Norma  ·  3.974 relações  ·  fonte: acervo legis-md, esfera federal</text>
</svg>
